services:
  minio:
    image: minio/minio:latest
    container_name: vehicleshoot-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: vehicleshoot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: vehicleshoot-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      DATABASE_URL: file:./dev.db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 9000
      REDIS_URL: redis://redis:6379
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-development-only-change-me}
      CANDIDATE_FRAMES: 108
      TARGET_FRAMES: 36
      MAX_CANDIDATE_SIDE: ${MAX_CANDIDATE_SIDE:-3840}
    depends_on:
      - minio
      - redis
    volumes:
      - ./backend:/app
      - ./frontend/dist:/app/frontend/dist:ro
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: vehicleshoot-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:3000
      VITE_WATCH_POLLING: 'true'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  ai-worker:
    build:
      context: ./ai-worker
      args:
        REMBG_MODEL: ${REMBG_MODEL:-birefnet-general-lite}
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-development-only-change-me}
      TARGET_FRAMES: 36
      ENABLE_ALPHA_MATTING: 'false'
      ENABLE_GLASS_REPAIR: 'false'
      ENABLE_TARGET_LOCK: ${ENABLE_TARGET_LOCK:-true}
      MAX_ROLL_CORRECTION: ${MAX_ROLL_CORRECTION:-3.5}
      MAX_VEHICLE_ROLL_CORRECTION: ${MAX_VEHICLE_ROLL_CORRECTION:-2.5}
      MAX_PERSPECTIVE_WARP: ${MAX_PERSPECTIVE_WARP:-0.3}
      TARGET_CONTACT_ANGLE_DEGREES: ${TARGET_CONTACT_ANGLE_DEGREES:-1.0}
      MIN_WHEEL_PAIR_ASPECT_RATIO: ${MIN_WHEEL_PAIR_ASPECT_RATIO:-1.0}
      MAX_PROCESSING_SIDE: ${MAX_PROCESSING_SIDE:-1920}
      MAX_DETAIL_SIDE: ${MAX_DETAIL_SIDE:-3840}
      STUDIO_CANVAS_WIDTH: ${STUDIO_CANVAS_WIDTH:-3200}
      STUDIO_CANVAS_HEIGHT: ${STUDIO_CANVAS_HEIGHT:-1800}
      STALE_AFTER_MS: ${STALE_AFTER_MS:-120000}
      TARGET_LOCK_CROP_TOP: ${TARGET_LOCK_CROP_TOP:-0.16}
      TARGET_LOCK_CROP_BOTTOM: ${TARGET_LOCK_CROP_BOTTOM:-0.96}
      REMBG_MODEL: ${REMBG_MODEL:-birefnet-general-lite}
      OMP_NUM_THREADS: ${AI_WORKER_THREADS:-4}
      ONNX_DISABLE_CPU_ARENA: ${ONNX_DISABLE_CPU_ARENA:-true}
      PYTHONUNBUFFERED: '1'
    depends_on:
      - minio
      - redis
      - backend
    volumes:
      - ./ai-worker:/app
    restart: unless-stopped
    deploy:
      # A single CPU BiRefNet inference can temporarily use several GB of RAM.
      # One worker is the safe default on an 8 GB Docker Desktop allocation.
      replicas: 1

volumes:
  minio_data:
  redis_data:
